<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibrasGo - Aprenda Libras com Realidade Aumentada</title>
    <meta name="description" content="Aplicativo gamificado estilo Duolingo para aprender LIBRAS com feedback instantâneo via câmera e realidade aumentada, lições diárias, ofensiva e rankings globais." />
    <meta property="og:title" content="LibrasGo - Aprenda Libras com Realidade Aumentada" />
    <meta property="og:description" content="Aplicativo gamificado estilo Duolingo para aprender LIBRAS com feedback instantâneo via câmera e realidade aumentada, lições diárias, ofensiva e rankings globais." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LibrasGo" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function() {
        try {
          var savedStats = localStorage.getItem('librasgo_user_stats');
          var theme = localStorage.getItem('librasgo_theme');
          if (savedStats) {
            var parsed = JSON.parse(savedStats);
            theme = theme || parsed.activeTheme;
          }
          var themeBgs = {
            'emerald': '#010905',
            'neon-cyber': '#010508',
            'cyan': '#01090c',
            'purple': '#080210',
            'blue': '#010811',
            'pink': '#0a0108',
            'gold-champion': '#0c0700',
            'crimson': '#0a0103',
            'indigo': '#03040f',
            'dark': '#020617'
          };
          var bg = themeBgs[theme] || '#010508';
          document.documentElement.style.backgroundColor = bg;
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- MediaPipe Hands for Real-time Computer Vision Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
