<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="170" fill="#10b981" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Libras L Hand Shape & Badge -->
  <g filter="url(#glow)" transform="translate(4, -10)">
    <!-- Palm base -->
    <rect x="210" y="240" width="130" height="150" rx="42" fill="url(#handGrad)" stroke="#047857" stroke-width="6"/>

    <!-- Index Finger (extended high in L) -->
    <rect x="212" y="100" width="46" height="160" rx="23" fill="url(#handGrad)" stroke="#047857" stroke-width="6"/>

    <!-- Thumb (extended to 90 degrees) -->
    <rect x="110" y="270" width="125" height="46" rx="23" fill="url(#handGrad)" stroke="#047857" stroke-width="6"/>

    <!-- Folded Fingers (Middle, Ring, Pinky) -->
    <rect x="268" y="240" width="38" height="60" rx="19" fill="#059669" stroke="#047857" stroke-width="5"/>
    <rect x="306" y="250" width="36" height="52" rx="18" fill="#047857" stroke="#064e3b" stroke-width="5"/>

    <!-- AR Cyber Ring Accents -->
    <circle cx="235" cy="120" r="14" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="130" cy="293" r="14" fill="#ffffff" fill-opacity="0.9"/>
    
    <!-- Sparkle Stars -->
    <path d="M 370 140 Q 385 140 385 125 Q 385 140 400 140 Q 385 140 385 155 Q 385 140 370 140 Z" fill="#fbbf24"/>
    <path d="M 120 180 Q 130 180 130 170 Q 130 180 140 180 Q 130 180 130 190 Q 130 180 120 180 Z" fill="#38bdf8"/>
  </g>

  <!-- App Title Pill -->
  <rect x="156" y="405" width="200" height="42" rx="21" fill="#020617" fill-opacity="0.85" stroke="#10b981" stroke-width="3"/>
  <text x="256" y="432" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">LIBRASGO</text>
</svg>
